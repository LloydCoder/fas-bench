name: CI

on:
  push:
    branches: ["main", "phase-1-contract"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Build package
        run: python -m build
      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Package import
        run: python -c "import fas_bench; assert fas_bench.__version__ == '0.1.0'"
      - name: Repository contract
        run: pytest tests/test_contract.py tests/test_docs.py
