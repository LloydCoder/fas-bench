name: CI
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Git diff check
        run: git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Schema meta-validation
        run: python -c "from pathlib import Path; from jsonschema import Draft202012Validator; import json; [Draft202012Validator.check_schema(json.loads(p.read_text())) for p in Path('schemas').rglob('*.schema.json')]"
      - name: Fixture validation
        run: python -m fas_bench validate tests/fixtures/valid/submission.json --schema submission
      - name: Build
        run: python -m build
      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Package import
        run: python -c "import fas_bench; assert fas_bench.__version__ == '0.1.0'"
      - name: Pull pinned oracle image
        run: docker pull python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
      - name: Phase 9 isolated execution integration
        run: |
          python - <<'PY'
          from fas_bench.secure_eval import ExecutionPolicy, ExecutionRequest, SecureRunner
          image = "python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea"
          result = SecureRunner(ExecutionPolicy(image=image)).execute(
              ExecutionRequest(
                  "FAS-001",
                  "CI-SECURE-EXEC",
                  ("/usr/local/bin/python", "-c", "from pathlib import Path; Path('/output/proof.txt').write_text('phase9-ok')"),
              )
          )
          assert result.status == "SUCCESS", result.as_dict()
          assert any(a.path == "proof.txt" and a.size == 9 for a in result.artifacts), result.as_dict()
          assert result.run_id and result.input_digest and result.manifest_sha256
          PY
      - name: Phase 9 adversarial isolation integration
        run: |
          python - <<'PY'
          from fas_bench.secure_eval import ExecutionPolicy, ExecutionRequest, SecureRunner
          image = "python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea"
          code = r"""
          import os
          import pathlib
          import socket
          import re
          assert os.getuid() != 0
          assert not pathlib.Path("/var/run/docker.sock").exists()
          assert pathlib.Path("/etc").is_dir()
          try:
              pathlib.Path("/etc/fas-bench-write-test").write_text("x")
          except (PermissionError, OSError):
              pass
          else:
              raise AssertionError("root filesystem is writable")
          status = pathlib.Path("/proc/self/status").read_text()
          cap = re.search(r"^CapEff:\s*([0-9a-fA-F]+)$", status, re.MULTILINE)
          assert cap and int(cap.group(1), 16) == 0
          nnp = re.search(r"^NoNewPrivs:\s*(\d+)$", status, re.MULTILINE)
          assert nnp and nnp.group(1) == "1"
          try:
              socket.create_connection(("1.1.1.1", 443), timeout=1)
          except OSError:
              pass
          else:
              raise AssertionError("network isolation failed")
          pathlib.Path("/output/isolation-proof.txt").write_text("isolated")
          """
          result = SecureRunner(ExecutionPolicy(image=image)).execute(
              ExecutionRequest("FAS-001", "CI-SECURITY-BOUNDARY", ("/usr/local/bin/python", "-c", code))
          )
          assert result.status == "SUCCESS", result.as_dict()
          assert any(a.path == "isolation-proof.txt" for a in result.artifacts)
          PY
      - name: Corpus validation
        run: fas-bench cases validate-all
      - name: Evidence engine CLI smoke test
        run: fas-bench evidence validate tests/fixtures/integrated/FAS-001.json --case FAS-001 --json
      - name: Verdict engine CLI smoke test
        run: fas-bench evaluate finding --case FAS-001 --submission tests/fixtures/phase5/FAS-001-gold.json --strict --json
      - name: Gold reproduction
        run: fas-bench cases validate-gold --reproduce
      - name: Phase 8 self-test
        run: fas-bench self-test --output /tmp/fas-bench-phase8
      - name: Phase 8 analytics CLI
        run: fas-bench analyze /tmp/fas-bench-phase8/results.json --bootstrap 200 --seed 0
      - name: Phase 8 report CLI
        run: fas-bench report /tmp/fas-bench-phase8/results.json --output /tmp/fas-bench-phase8-regenerated
      - name: Phase 9 fail-closed smoke test
        run: |
          python - <<'PY'
          from fas_bench.secure_eval import ExecutionPolicy, ExecutionRequest, SecureRunner
          p = ExecutionPolicy("ghcr.io/example/fas-bench@sha256:" + "a" * 64)
          r = SecureRunner(p, docker_binary="fas-bench-no-such-docker")
          result = r.execute(ExecutionRequest("FAS-001", "CI-FAIL-CLOSED", ("/bin/true",)))
          assert result.failure_code == "ISOLATION_UNAVAILABLE"
          assert result.status == "FAILED"
          PY
      - name: Repository contract
        run: pytest tests/test_contract.py tests/test_docs.py tests/test_phase3_cases.py
