name: CI
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Git diff check
        run: git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Schema meta-validation
        run: python -c "from pathlib import Path; from jsonschema import Draft202012Validator; import json; [Draft202012Validator.check_schema(json.loads(p.read_text())) for p in Path('schemas').rglob('*.schema.json')]"
      - name: Fixture validation
        run: python -m fas_bench validate tests/fixtures/valid/submission.json --schema submission
      - name: Build
        run: python -m build
      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Package import
        run: python -c "import fas_bench; assert fas_bench.__version__ == '0.1.0'"
      - name: Pull pinned oracle image
        run: docker pull python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
      - name: Corpus validation
        run: fas-bench cases validate-all
      - name: Evidence engine CLI smoke test
        run: fas-bench evidence validate tests/fixtures/integrated/FAS-001.json --case FAS-001 --json
      - name: Verdict engine CLI smoke test
        run: fas-bench evaluate finding --case FAS-001 --submission tests/fixtures/integrated/FAS-001-gold.json --strict --json
      - name: Gold reproduction
        run: fas-bench cases validate-gold --reproduce
      - name: Repository contract
        run: pytest tests/test_contract.py tests/test_docs.py tests/test_phase3_cases.py
