name: CI
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12","3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Git diff check
        run: git diff --check
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Format source and tests
        run: ruff format --check src tests
      - name: Format cases 001-005
        run: ruff format --check cases/FAS-001 cases/FAS-002 cases/FAS-003 cases/FAS-004 cases/FAS-005
      - name: Format cases 006-010
        run: ruff format --check cases/FAS-006 cases/FAS-007 cases/FAS-008 cases/FAS-009 cases/FAS-010
      - name: Format cases 011-015
        run: ruff format --check cases/FAS-011 cases/FAS-012 cases/FAS-013 cases/FAS-014 cases/FAS-015
      - name: Format cases 016-020
        run: ruff format --check cases/FAS-016 cases/FAS-017 cases/FAS-018 cases/FAS-019 cases/FAS-020
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Schema meta-validation
        run: python -c "from pathlib import Path; from jsonschema import Draft202012Validator; import json; [Draft202012Validator.check_schema(json.loads(p.read_text())) for p in Path('schemas').rglob('*.schema.json')]"
      - name: Fixture validation
        run: python -m fas_bench validate tests/fixtures/valid/submission.json --schema submission
      - name: Build
        run: python -m build
      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Package import
        run: python -c "import fas_bench; assert fas_bench.__version__ == '0.1.0'"
      - name: Corpus validation
        run: fas-bench cases validate-all
      - name: Gold reproduction
        run: fas-bench cases validate-gold --reproduce
      - name: Repository contract
        run: pytest tests/test_contract.py tests/test_docs.py tests/test_phase3_cases.py
