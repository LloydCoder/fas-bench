name: Phase 4 Digest Maintenance
on:
  push:
    branches: ["phase-4-evidence-engine"]
permissions:
  contents: write
jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recompute case digests
        run: python scripts/recompute_case_digests.py
      - name: Commit digest updates
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cases/*/metadata.json cases/manifest.json
          git commit -m "Phase 4: refresh case integrity digests"
          git push
