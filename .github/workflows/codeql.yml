name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4f900f43bc6bfc406aac5f37e402badfc55f9342
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@4f900f43bc6bfc406aac5f37e402badfc55f9342
        with:
          category: "/language:python"
