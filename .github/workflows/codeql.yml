name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@592d162ba3b2f5a3411d2cbf01df9f82c492f269
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@4f900f43bc6bfc406aac5f37e402badfc55f9342
        with:
          category: "/language:python"
