name: Phase 10 Release Gate
on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Human-readable release version"
        required: true
        default: "0.1.0-phase10-rc1"
      channel:
        description: "Release channel"
        required: true
        default: "release-candidate"
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Pull pinned oracle image
        run: docker pull python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
      - name: Tests
        run: pytest
      - name: Schema meta-validation
        run: python -c "from pathlib import Path; from jsonschema import Draft202012Validator; import json; [Draft202012Validator.check_schema(json.loads(p.read_text())) for p in Path('schemas').rglob('*.schema.json')]"
      - name: Full corpus validation
        run: fas-bench corpus validate
      - name: Gold validation
        run: fas-bench cases validate-gold --reproduce
      - name: Contamination audit
        run: fas-bench contamination scan
      - name: Independence audit
        run: fas-bench contamination independence
      - name: Validate release inputs
        env:
          RELEASE_VERSION: ${{ inputs.release_version || '0.1.0-phase10-rc1' }}
          RELEASE_CHANNEL: ${{ inputs.channel || 'release-candidate' }}
        run: |
          python - <<'PY'
          import os, re
          version=os.environ["RELEASE_VERSION"]
          channel=os.environ["RELEASE_CHANNEL"]
          assert re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]{0,127}", version)
          assert channel in {"development","release-candidate","public","official"}
          PY
      - name: Build release manifest
        env:
          RELEASE_VERSION: ${{ inputs.release_version || '0.1.0-phase10-rc1' }}
          RELEASE_CHANNEL: ${{ inputs.channel || 'release-candidate' }}
        run: fas-bench benchmark release --version "$RELEASE_VERSION" --channel "$RELEASE_CHANNEL" > release-manifest.json
      - name: Verify release manifest
        run: fas-bench release verify release-manifest.json
      - name: Independent manifest verification
        run: fas-bench verification manifest release-manifest.json
      - name: Reproduce release manifest
        env:
          RELEASE_VERSION: ${{ inputs.release_version || '0.1.0-phase10-rc1' }}
          RELEASE_CHANNEL: ${{ inputs.channel || 'release-candidate' }}
        run: |
          fas-bench benchmark release --version "$RELEASE_VERSION" --channel "$RELEASE_CHANNEL" > release-manifest-reproduced.json
          python - <<'PY'
          import json
          a=json.load(open("release-manifest.json"))
          b=json.load(open("release-manifest-reproduced.json"))
          assert a == b, "release manifest reproduction mismatch"
          PY
      - name: Reproducible package build
        run: |
          rm -rf /tmp/fas-bench-dist-a /tmp/fas-bench-dist-b
          SOURCE_DATE_EPOCH=1600000000 python -m build --outdir /tmp/fas-bench-dist-a
          SOURCE_DATE_EPOCH=1600000000 python -m build --outdir /tmp/fas-bench-dist-b
          python - <<'PY'
          import hashlib
          from pathlib import Path
          def hashes(root):
              return {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in Path(root).iterdir()}
          assert hashes("/tmp/fas-bench-dist-a") == hashes("/tmp/fas-bench-dist-b")
          PY
      - name: Build package
        run: python -m build
      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Installed CLI corpus validation
        run: fas-bench corpus validate
      - name: Installed CLI doctor
        run: fas-bench benchmark doctor
      - name: Package leakage audit
        run: |
          ! find dist -type f -print0 | xargs -0 grep -IlE '(-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,})'
      - name: Release manifest digest
        run: python -c "import json,hashlib; d=json.load(open('release-manifest.json')); x=dict(d); x.pop('release_digest',None); c=json.dumps(x,sort_keys=True,separators=(',',':'),ensure_ascii=False)+'\n'; assert hashlib.sha256(c.encode()).hexdigest()==d['release_digest']"

      - name: Phase 10.1 independent health gate
        run: fas-bench benchmark doctor
      - name: Phase 10.1 adversarial regressions
        run: pytest tests/test_phase10_1.py tests/test_phase9_secure_eval.py
      - name: Independent verifier tamper test
        run: |
          python - <<'PY'
          import json, subprocess
          m=json.load(open("release-manifest.json"))
          m["component_digests"]["README.md"]="0"*64
          import hashlib
          u={k:v for k,v in m.items() if k!="release_digest"}
          m["release_digest"]=hashlib.sha256((json.dumps(u,sort_keys=True,separators=(",",":"),ensure_ascii=False)+"\n").encode()).hexdigest()
          json.dump(m,open("/tmp/tampered-manifest.json","w"))
          p=subprocess.run(["fas-bench","verification","manifest","/tmp/tampered-manifest.json"])
          assert p.returncode != 0, "tampered manifest unexpectedly accepted"
          PY
      - name: Release manifest independent verification
        run: fas-bench verification manifest release-manifest.json
      - name: Generate release certification
        run: fas-bench verification certify release-manifest.json --security-status PASS --output verification-report.json
      - name: Require release certification
        run: python -c "import json; r=json.load(open('verification-report.json')); assert r['status']=='CERTIFIED', r"
      - name: Upload certification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fas-bench-release-certification
          path: |
            verification-report.json
            release-manifest.json
            release-manifest-reproduced.json
          if-no-files-found: error
