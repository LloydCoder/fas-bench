name: Phase 9 Formatter
on:
  push:
    branches: ["phase-9-secure-evaluation"]
permissions:
  contents: write
jobs:
  format:
    if: github.actor == 'LloydCoder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.12,<1"
      - name: Format
        run: ruff format .
      - name: Commit formatted sources
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "LloydCoder"
          git config user.email "140634407+LloydCoder@users.noreply.github.com"
          git add .
          git commit -m "style: format Phase 9 sources"
          git push
