name: Case Validation
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate corpus
        run: fas-bench corpus validate
      - name: Validate legacy corpus contract
        run: fas-bench cases validate-all
      - name: Reproduce corpus
        run: python -c "from fas_bench.cases import reproduce_all; import json; r=reproduce_all(); print(json.dumps(r, indent=2)); raise SystemExit(0 if r['status']=='PASS' else 1)"
      - name: Validate gold cases
        run: fas-bench cases validate-gold --reproduce
      - name: Contamination scan
        run: fas-bench contamination scan
