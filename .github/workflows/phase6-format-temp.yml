name: Phase 6 Temporary Formatter
on:
  push:
    branches: ["phase-6-security-graph-engine"]
permissions:
  contents: write
jobs:
  format:
    if: github.actor == 'LloydCoder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.12,<1"
      - name: Format
        run: ruff format .
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "LloydCoder"
          git config user.email "140634407+LloydCoder@users.noreply.github.com"
          git add src tests
          git commit -m "Phase 6: apply Ruff formatting"
          git push
