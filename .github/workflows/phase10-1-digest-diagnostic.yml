name: Phase 10.1 Digest Diagnostic
on:
  push:
    branches: ["phase10.1-security-release-hardening"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Import side-effect diagnostic
        run: |
          python - <<'PY'
          from fas_bench.cases import validate_all
          print("BEFORE", validate_all()["errors"][:10])
          import fas_bench.phase10
          print("AFTER", validate_all()["errors"][:10])
          PY
      - name: Recompute and show digest changes
        run: |
          python scripts/reconcile_case_digests.py
          git diff -- cases/FAS-001/metadata.json cases/FAS-001/case.json | head -200
          git status --short cases
