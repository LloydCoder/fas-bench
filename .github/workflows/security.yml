name: Security
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q src cases
      - name: Repository secret-pattern audit
        run: |
          ! grep -RInE '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,})' --exclude-dir=.git .
      - name: Dangerous Docker configuration audit
        run: |
          ! grep -RInE -- '--privileged|/var/run/docker.sock|--network[[:space:]]+host' cases .github
