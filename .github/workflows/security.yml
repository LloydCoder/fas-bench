name: Security
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Case checkout diagnostics
        run: |
          git status --short cases
          git diff --numstat -- cases
          git diff -- cases | head -200
      - name: Compile Python
        run: python -m compileall -q src cases
      - name: Dependency vulnerability audit
        run: python -m pip install pip-audit==2.9.0 && pip freeze | grep -vE '^(-e |fas-bench==)' > /tmp/fas-bench-audit-requirements.txt && pip-audit --strict -r /tmp/fas-bench-audit-requirements.txt
      - name: Phase 10.1 adversarial regression suite
        run: pytest tests/test_phase10_1.py
      - name: Repository secret-pattern audit
        run: |
          ! grep -RInE '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,})' --exclude-dir=.git .
      - name: Dangerous Docker configuration audit
        run: |
          ! grep -RInE --exclude=security.yml --exclude=ci.yml --exclude=phase10-release.yml '--privileged|/var/run/docker.sock|--network[[:space:]]+host' cases .github
      - name: Phase 10 independence audit
        run: fas-bench contamination independence
      - name: Phase 10 release schema audit
        run: python -c "from pathlib import Path; from jsonschema import Draft202012Validator; import json; [Draft202012Validator.check_schema(json.loads(p.read_text())) for p in Path('schemas').rglob('*.schema.json')]"
