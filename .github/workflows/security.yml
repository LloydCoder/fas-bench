name: Security
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  security:
    runs-on: [self-hosted, linux, x64, pcidss-hp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q src cases
      - name: Repository secret-pattern audit
        run: |
          ! grep -RInE '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,})' --exclude-dir=.git .
      - name: Dangerous Docker configuration audit
        run: |
          ! grep -RInE --exclude=security.yml --exclude=ci.yml --exclude=phase10-release.yml '--privileged|/var/run/docker.sock|--network[[:space:]]+host' cases .github
      - name: Phase 10 independence audit
        run: fas-bench contamination independence
      - name: Phase 10 release schema audit
        run: python -c "from pathlib import Path; from jsonschema import Draft202012Validator; import json; [Draft202012Validator.check_schema(json.loads(p.read_text())) for p in Path('schemas').rglob('*.schema.json')]"
