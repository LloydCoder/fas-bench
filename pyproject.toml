[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fas-bench"
version = "0.1.0.dev0"
description = "Evidence-first benchmark for evaluating security analysis by AI agents, scanners, and security systems."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "LloydCoder" }]
keywords = ["security", "cybersecurity", "benchmark", "ai-agents", "llm", "sast", "vulnerability-analysis", "exploitability", "security-research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security"
]

[tool.hatch.build.targets.wheel]
packages = ["src/fas_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
