[build-system]
requires=["hatchling>=1.27"]
build-backend="hatchling.build"

[project]
name="fas-bench"
version="0.1.0"
description="Evidence-first benchmark for evaluating security analysis by AI agents, scanners, and security systems."
readme="README.md"
requires-python=">=3.12"
license={file="LICENSE"}
authors=[{name="LloydCoder"}]

[project.optional-dependencies]
dev=["build>=1.2,<2","pytest>=8,<9","ruff>=0.12,<1","jsonschema>=4.23,<5","referencing>=0.35,<1"]

[project.scripts]
fas-bench="fas_bench.phase10_entry:main"

[tool.hatch.build.targets.wheel]
packages=["src/fas_bench"]

[tool.hatch.build.targets.wheel.force-include]
schemas="fas_bench/schemas"
"src/fas_bench/scoring/config/v0.1.json"="fas_bench/scoring/config/v0.1.json"

[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-ra"

[tool.ruff]
line-length=100
target-version="py312"

[tool.ruff.lint]
select=["E","F","I","UP","B"]
per-file-ignores={"src/fas_bench/secure_eval/*.py"=["E501"],"tests/test_phase9_secure_eval.py"=["E501"]}
